test_name: Uso de Plataformas Virtuales
llm:
  temperature: 0.4
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Estudiante que necesita información sobre cómo acceder y utilizar las plataformas virtuales de UAM.
  context:
  - Como nuevo estudiante en la UAM, necesitas acceder a las plataformas virtuales para comenzar tus estudios de manera efectiva.
  - Estás buscando información específica sobre los requisitos y pasos a seguir para utilizar Moodle y los servicios integrados de ID-UAM.
  - Además, te gustaría conocer las herramientas disponibles que faciliten tu acceso a estas plataformas y el proceso para obtener tu número de identificación académico.
  goals:
  - Solicitar información sobre cómo acceder a la plataforma Moodle para comenzar a estudiar.
  - Preguntar cuáles son los requisitos para acceder a Moodle, específicamente si necesito una {{cuenta_institucional}}.
  - Pedir una lista de botones disponibles para recibir más ayuda con el acceso a Moodle.
  - Especificar el tipo de detalle que deseo saber sobre los servicios integrados en ID-UAM, como características o precios.
  - Solicitar información sobre el proceso para obtener un número de identificación académico (NIA) como nuevo estudiante.
  - cuenta_institucional:
      function: forward()
      type: string
      data:
      - cuenta@universidad.edu
      - usuario@empresa.com
      - estudiante@colegio.edu
      - empleado@organizacion.org
chatbot:
  is_starter: false
  fallback: ¿Puedes preguntármelo de otra forma? o, si lo prefieres, puedes consultar nuestro\ncatálogo de servicios\n.\nRespondo a preguntas dirigidas al\nCentro de Atención a Usuarios del servicio de Tecnologías de la Información.
  output:
  - access_requirements:
      type: string
      description: Requisitos para acceder a Moodle
  - available_environments:
      type: string
      description: Entornos de Moodle disponibles
  - button_texts:
      type: string
      description: Texto de botones para ayuda en acceso
  - detail_requested:
      type: string
      description: Detalles sobre características o precios
  - nia_obtainment_info:
      type: string
      description: Proceso para obtener un número de identificación académico
conversation:
  number: 4
  max_cost: 0.6
  goal_style:
    steps: 20
  interaction_style:
  - single question
