test_name: Soporte Técnico y Gestión de Contraseñas
llm:
  temperature: 0.5
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Usuario con problemas de acceso a su cuenta y necesidad de soporte técnico.
  context:
  - 'personality: personalities/formal-user'
  - Te encuentras en una situación difícil porque no puedes acceder a tu cuenta ID-UAM y necesitas ayuda técnica urgente.
  - Además, es esencial que establezcas una contraseña segura y conozcas las políticas de cambio para evitar que tu cuenta se bloquee en el futuro.
  - Buscas obtener información de contacto del Centro de Atención a Usuarios para resolver tus inquietudes lo más pronto posible.
  goals:
  - Solicitar información sobre los pasos para cambiar la contraseña de mi cuenta ID-UAM cuando he olvidado mis credenciales.
  - Pedir detalles sobre cómo establecer una contraseña para mi cuenta ID-UAM por primera vez.
  - Preguntar sobre la frecuencia con la que debo cambiar mi contraseña para evitar el bloqueo de mi cuenta.
  - Solicitar la información de contacto completa del Centro de Atención a Usuarios (CAU) de la UAM.
  - Consultar cuáles son los servicios integrados en ID-UAM para estudiantes y personal.
chatbot:
  is_starter: false
  fallback: ¿Puedes preguntármelo de otra forma? o, si lo prefieres, puedes consultar nuestro\ncatálogo de servicios\n.\nRespondo a preguntas dirigidas al\nCentro de Atención a Usuarios del servicio de Tecnologías de la Información.
  output:
  - password_reset_steps:
      type: string
      description: Steps for password recovery
  - first_time_password_steps:
      type: string
      description: Steps for first password creation
  - password_change_frequency:
      type: string
      description: Recommended password change interval
  - contact_email:
      type: string
      description: Email address for user support
  - contact_phone:
      type: string
      description: Phone number for user support
  - contact_address:
      type: string
      description: Physical address of user support
  - support_hours:
      type: string
      description: Business hours of user support
  - faq_link:
      type: string
      description: Link to frequently asked questions
  - services_catalog_link:
      type: string
      description: Link to the services catalog
  - account_creation_instructions:
      type: string
      description: Instructions for creating an ID-UAM account
  - ticket_submission_advice:
      type: string
      description: Advice for opening a support ticket
  - available_services_list:
      type: string
      description: List of services for students and staff
  - operational_hours:
      type: string
      description: Detailed support operating hours
  - user_support_contact_info:
      type: string
      description: Comprehensive contact details for user support
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
