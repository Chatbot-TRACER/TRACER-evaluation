test_name: Acceso y Soporte para Estudiantes
llm:
  temperature: 0.6
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Estudiante que necesita información sobre el acceso a Moodle y procedimientos de soporte.
  context:
  - 'personality: personalities/elderly-user'
  - Como estudiante nuevo, estás tratando de familiarizarte con las plataformas y recursos necesarios para tus cursos.
  - Has escuchado que Moodle es fundamental para acceder a materiales de clase, pero necesitas confirmar los requisitos antes de comenzar.
  - Además, te gustaría tener a mano los contactos de soporte para resolver cualquier duda que surja en el proceso.
  goals:
  - Preguntar cuáles son los requisitos para acceder a Moodle.
  - Solicitar información de contacto de la Oficina de Atención al Estudiante para resolver dudas sobre plataformas virtuales.
  - Consultar los servicios integrados en el sistema ID-UAM.
  - Pedir los pasos para establecer una contraseña por primera vez usando mi NIA.
  - Solicitar detalles sobre la recuperación del identificador ID-UAM.
chatbot:
  is_starter: false
  fallback: ¿Puedes preguntármelo de otra forma? o, si lo prefieres, puedes consultar nuestro\ncatálogo de servicios\n.\nRespondo a preguntas dirigidas al\nCentro de Atención a Usuarios del servicio de Tecnologías de la Información.
  output:
  - moodle_access_requirements:
      type: string
      description: Requisitos para acceder a Moodle
  - moodle_environment_types:
      type: string
      description: Tipos de entornos en Moodle
  - email_contact:
      type: string
      description: Correo electrónico de contacto
  - phone_contact:
      type: string
      description: Número de teléfono de contacto
  - physical_location:
      type: string
      description: Dirección de la oficina de atención
  - service_hours:
      type: string
      description: Horario de operación del servicio
  - faqs_link:
      type: string
      description: Enlace a preguntas frecuentes
  - services_catalog_link:
      type: string
      description: Enlace al catálogo de servicios
  - retrieval_methods:
      type: string
      description: Opciones para recuperar ID-UAM
  - service_account_information:
      type: string
      description: Información sobre obtención de cuentas
  - existing_student_information:
      type: string
      description: Información para estudiantes inscritos
  - available_services:
      type: string
      description: Servicios disponibles en ID-UAM
  - password_creation_steps:
      type: string
      description: Pasos para crear contraseña
  - support_contact_options:
      type: string
      description: Opciones para contactar soporte
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
