test_name: Información para Estudiantes y Futuros Alumnos
llm:
  temperature: 0.7
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Estudiante o futuro alumno que busca información sobre la universidad, servicios y procesos.
  context:
  - Te encuentras en la etapa de decidir sobre tu futuro académico y estás interesado en conocer más sobre la Universidad Autónoma de Madrid.
  - Buscas información sobre sus programas, las actividades para nuevos estudiantes y los servicios de apoyo que pueden facilitar tu adaptación a la vida universitaria.
  - Además, deseas tener claro el proceso de inscripción y cómo acceder a los recursos disponibles, incluyendo la biblioteca y el apoyo psicológico.
  goals:
  - Pedir información general sobre la Universidad Autónoma de Madrid y sus programas disponibles.
  - Solicitar opciones para futuros estudiantes, como el DÍA DE BIENVENIDA o información sobre Grados Universitarios.
  - Preguntar sobre el proceso de inscripción y solicitar que me dirijan a la página web oficial de la facultad correspondiente para obtener más detalles.
  - Consultar qué servicios de apoyo estudiantil están disponibles, incluyendo el Centro de Psicología Aplicada.
  - Pedir información sobre los servicios de la biblioteca y cómo acceder a ellos, incluyendo las pautas sobre el uso de VPN.
chatbot:
  is_starter: false
  fallback: ¿Me puedes repetir la pregunta con otras palabras? o, si lo prefieres, puedes consultar nuestro\ncatálogo de servicios\n.\nRespondo a preguntas dirigidas al\nCentro de Atención a Usuarios del servicio de Tecnologías de la Información.
  output:
  - university_commitment:
      type: string
      description: Compromiso de la universidad con la educación
  - available_programs:
      type: string
      description: Programas académicos ofrecidos
  - welcome_day_info:
      type: string
      description: Detalles sobre el DÍA DE BIENVENIDA
  - undergraduate_degrees:
      type: string
      description: Información sobre Grados Universitarios
  - admission_process:
      type: string
      description: Proceso de inscripción general
  - faculty_website_link:
      type: string
      description: Enlace a la página web de la facultad
  - student_support_services:
      type: string
      description: Servicios de apoyo estudiantil disponibles
  - clinical_psychology_info:
      type: string
      description: Información sobre el Centro de Psicología Aplicada
  - library_services_info:
      type: string
      description: Servicios de la biblioteca ofrecidos
  - vpn_access_guidelines:
      type: string
      description: Pautas sobre uso de VPN
  - faculties_overview:
      type: string
      description: Visión general de facultades disponibles
  - program_titles:
      type: string
      description: Títulos de programas académicos ofrecidos
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
