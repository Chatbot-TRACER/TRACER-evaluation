test_name: Nuevos estudiantes y personal en proceso de incorporación
llm:
  temperature: 0.6
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Nuevos estudiantes o personal que necesita establecer contraseñas por primera vez durante el proceso de enrolamiento o incorporación.
  context:
  - Como nuevo estudiante en la universidad, necesitas establecer tu contraseña para acceder a los servicios académicos y administrativos esenciales.
  - Estás buscando orientación sobre cómo realizar este proceso correctamente y qué servicios serán de utilidad en tu vida académica.
  - Además, te gustaría saber cómo contactar al soporte técnico en caso de que surjan problemas durante la inscripción.
  goals:
  - Preguntar cómo establecer una contraseña por primera vez durante la inscripción utilizando el ID-UAM.
  - Solicitar la información sobre los servicios disponibles bajo el sistema ID-UAM.
  - Pedir detalles sobre cómo contactar al CAU para soporte adicional usando la información de contacto proporcionada.
  - Consultar el catálogo de servicios integrados en ID-UAM para estudiantes y personal.
chatbot:
  is_starter: false
  fallback: Por favor, ¿me lo puedes decir con otras palabras? o, si lo prefieres, puedes consultar nuestro catálogo de servicios. Respondo a preguntas dirigidas al Centro de Atención a Usuarios del servicio de Tecnologías de la Información.
  output:
  - password_creation_steps:
      type: string
      description: Instrucciones para crear contraseña
  - id_uam_information:
      type: string
      description: Información sobre ID-UAM
  - contact_information_cau:
      type: string
      description: Detalles de contacto del CAU
  - available_services:
      type: string
      description: Servicios disponibles en ID-UAM
  - service_catalog:
      type: string
      description: Catálogo de servicios integrados
  - password_requirement:
      type: string
      description: Requisitos de la contraseña
  - enrollment_process:
      type: string
      description: Proceso de inscripción para nuevos estudiantes
  - support_hours_cau:
      type: string
      description: Horarios de atención del CAU
  - account_creation_process:
      type: string
      description: Proceso para crear cuenta en ID-UAM
  - service_discovery_links:
      type: string
      description: Enlaces para descubrir servicios disponibles
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 28
  interaction_style:
  - single question
