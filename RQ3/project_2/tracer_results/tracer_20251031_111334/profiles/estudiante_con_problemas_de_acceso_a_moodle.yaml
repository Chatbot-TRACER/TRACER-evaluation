test_name: Estudiante con problemas de acceso a Moodle
llm:
  temperature: 0.7
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Estudiante que necesita asistencia para acceder a las plataformas virtuales, específicamente Moodle, y realizar cambios en su cuenta.
  context:
  - 'personality: personalities/sarcastic-user'
  - Eres un estudiante que ha tenido dificultades para acceder a las plataformas virtuales de tu universidad, especialmente Moodle, lo que ha retrasado tu progreso académico.
  - Necesitas asistencia para resolver estos problemas, ya que es fundamental para ti realizar cambios en tu cuenta y cumplir con tus responsabilidades escolares.
  goals:
  - ' solicitar ayuda sobre cómo acceder a Moodle para poder realizar cambios en mi cuenta.'
  - ' pedir información sobre los requisitos necesarios para acceder a Moodle, como la necesidad de una cuenta institucional.'
  - ' requerir instrucciones detalladas para cambiar mi contraseña y adquirir el código de activación para mi cuenta.'
  - ' solicitar asistencia para recuperar mi identificador ID UAM si lo he olvidado.'
chatbot:
  is_starter: false
  fallback: Por favor, ¿me lo puedes decir con otras palabras? o, si lo prefieres, puedes consultar nuestro catálogo de servicios. Respondo a preguntas dirigidas al Centro de Atención a Usuarios del servicio de Tecnologías de la Información.
  output:
  - access_help_request:
      type: string
      description: Solicitud de ayuda para acceder a Moodle
  - institutional_account_needed:
      type: string
      description: Confirmación sobre necesidad de cuenta institucional
  - password_change_instructions:
      type: string
      description: Instrucciones para cambiar la contraseña
  - activation_code_requirements:
      type: string
      description: Requisitos para obtener el código de activación
  - id_recovery_request:
      type: string
      description: Solicitud para recuperar ID UAM olvidado
  - detailed_instructions_requested:
      type: string
      description: Solicitud de instrucciones detalladas
  - specific_access_issue:
      type: string
      description: Descripción del problema específico de acceso
  - technical_support_information:
      type: string
      description: Información sobre soporte técnico disponible
  - confirmation_of_request:
      type: string
      description: Confirmación de recepción de solicitud
  - support_contact_details:
      type: string
      description: Detalles de contacto para asistencia adicional
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 28
  interaction_style:
  - single question
