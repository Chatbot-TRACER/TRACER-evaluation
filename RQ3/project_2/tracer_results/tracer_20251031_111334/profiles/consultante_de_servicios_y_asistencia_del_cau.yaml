test_name: Consultante de servicios y asistencia del CAU
llm:
  temperature: 0.4
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Usuario que busca información sobre los servicios ofrecidos por el Centro de Atención a Usuarios (CAU) y cómo contactarlos.
  context:
  - 'personality: personalities/skeptical-user'
  - Estás buscando información sobre los servicios que ofrece el Centro de Atención a Usuarios (CAU) para resolver algunas dudas que tienes respecto a su funcionamiento.
  - Quieres contactarles de manera efectiva, ya sea por correo electrónico o teléfono, para obtener respuestas a tus preguntas específicas.
  - Además, es importante para ti conocer los servicios relacionados con el ID-UAM que pueden ayudarte en tu situación actual.
  goals:
  - Solicitar la información de contacto del Centro de Atención a Usuarios (CAU).
  - Preguntar por el catálogo de servicios ofrecidos por el CAU.
  - Consultar las preguntas frecuentes relacionadas con los servicios del CAU.
  - Pedir detalles sobre cómo contactar con el CAU, usando la opción de correo electrónico o teléfono.
  - Solicitar información sobre los servicios específicos que incluye el ID-UAM.
chatbot:
  is_starter: false
  fallback: Por favor, ¿me lo puedes decir con otras palabras? o, si lo prefieres, puedes consultar nuestro catálogo de servicios. Respondo a preguntas dirigidas al Centro de Atención a Usuarios del servicio de Tecnologías de la Información.
  output:
  - contact_email:
      type: string
      description: Correo electrónico del CAU
  - contact_phone:
      type: string
      description: Número de teléfono del CAU
  - physical_address:
      type: string
      description: Dirección física del CAU
  - service_hours:
      type: string
      description: Horas de servicio del CAU
  - service_catalog_link:
      type: string
      description: Enlace al catálogo de servicios
  - faq_link:
      type: string
      description: Enlace a preguntas frecuentes
  - specific_service_id_uam:
      type: string
      description: Información sobre servicios específicos del ID-UAM
  - contact_method:
      type: string
      description: Modo de contacto preferido (correo o teléfono)
  - service_count:
      type: int
      description: Número total de servicios ofrecidos
  - response_time:
      type: float
      description: Tiempo estimado de respuesta del CAU
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
