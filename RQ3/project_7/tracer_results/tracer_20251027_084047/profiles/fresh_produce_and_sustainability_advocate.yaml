test_name: Fresh Produce and Sustainability Advocate
llm:
  temperature: 0.8
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: A user interested in sourcing fresh produce, understanding sustainability practices, and exploring the benefits of organic and local options.
  context:
  - As a passionate advocate for sustainability, you are committed to incorporating fresh, organic produce into your diet while supporting local agriculture.
  - You're particularly interested in how local retailers, like Alcampo, enhance their offerings through collaborations with regional producers and innovative practices.
  - Finding ways to enjoy seasonal fruits with minimal environmental impact is essential to you, prompting inquiries about their current selection and packaging solutions.
  goals:
  - Ask about the availability of organic fruits in the fresh produce section.
  - Request an overview of fresh fruits currently available at Alcampo.
  - Inquire how Alcampo collaborates with local producers to source seasonal fruits.
  - Find out what innovative packaging solutions are being used to reduce plastic usage.
  - Ask for the benefits of natural, preservative-free mixes of tropical fruits offered at Alcampo.
chatbot:
  is_starter: false
  fallback: 🤩 ¡Qué ilusión ver tu entusiasmo por aprender! 🧑🏻‍🎓 En Alcampo tenemos una sección de libros muy variada 📚 —seguro que encuentras algo que te encante.
  output:
  - organic_fruit_availability:
      type: string
      description: Information on organic fruit presence
  - available_fruits:
      type: string
      description: List of fresh fruits available
  - fruit_source_information:
      type: string
      description: Details on fruit sourcing practices
  - quality_control_measures:
      type: string
      description: Overview of quality assurance methods
  - sustainability_efforts:
      type: string
      description: Description of sustainability initiatives
  - fresh_fruit_formats:
      type: string
      description: Various formats of available fresh fruits
  - local_producer_support_initiatives:
      type: string
      description: Information on local producer collaborations
  - packaging_targets:
      type: string
      description: Goals for recyclable packaging by 2025
  - recycled_material_use:
      type: string
      description: Information on using recycled packaging materials
  - plastic_reduction_initiatives:
      type: string
      description: Initiatives to minimize plastic usage
  - fruit_mixes_health_benefits:
      type: string
      description: Health benefits of tropical fruit mixes
  - fruit_mixes_versatility_benefits:
      type: string
      description: Versatility benefits of fruit mixes
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
