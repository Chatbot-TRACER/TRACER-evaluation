test_name: Fresh and Organic Products Exploration
llm:
  temperature: 0.9
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: Health-conscious customer exploring fresh and organic food options
  context:
  - 'personality: personalities/sarcastic-user'
  - As a health-conscious individual, you're eager to find fresh and organic food options that align with your dietary preferences.
  - You're particularly interested in understanding the sourcing practices of organic products and the sustainability standards of fish options available.
  - Additionally, you're looking to explore healthy organic snacks that could support your lifestyle, while also being mindful of any promotions.
  goals:
  - Inquire about the variety of fresh and organic food options available at Alcampo.
  - Ask for detailed information about organic options in the fresh foods category, including sourcing practices.
  - Request details on available fish products, specifically focusing on sustainability certifications.
  - Find out about specific organic vegetable snacks available, including their health benefits and natural ingredients.
  - Ask for the typical promotions available for organic snacks at Alcampo.
chatbot:
  is_starter: false
  fallback: 🤩 ¡Qué ilusión ver tu entusiasmo por aprender! 🧑🏻‍🎓 En Alcampo tenemos una sección de libros muy variada 📚 —seguro que encuentras algo que te encante.
  output:
  - fresh_foods_variety:
      type: string
      description: Variety of fresh foods available
  - organic_food_options:
      type: string
      description: Details about organic options
  - fish_sustainability_certifications:
      type: string
      description: Information on fish sustainability certifications
  - organic_snacks_details:
      type: string
      description: Information on organic vegetable snacks
  - organic_snack_health_benefits:
      type: string
      description: Health benefits of organic snacks
  - natural_ingredients_snacks:
      type: string
      description: Natural ingredients in organic snacks
  - organic_snack_promotions:
      type: string
      description: Typical promotions for organic snacks
  - sourcing_practices:
      type: string
      description: Sourcing practices for organic products
  - available_fish_types:
      type: string
      description: Types of fish available at Alcampo
  - current_organic_promotions:
      type: string
      description: Current available promotions on organic products
  - promotional_discounts:
      type: money
      description: Discount amounts for organic snacks
  - snack_inventory_count:
      type: int
      description: Inventory count of specific organic snacks
  - fish_product_inventory_count:
      type: int
      description: Inventory count of fish products available
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
