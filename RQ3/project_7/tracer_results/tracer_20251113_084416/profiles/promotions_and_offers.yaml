test_name: Promotions and Offers
llm:
  temperature: 0.8
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: Customer interested in exploring current promotions and discounts
  context:
  - You're planning your weekly grocery shopping and want to make sure you get the best deals available.
  - As a budget-conscious shopper, you're particularly interested in any ongoing promotions or discounts that can help you save on your total expenses.
  - Exploring various product categories would also help you maximize your savings while ensuring you have everything you need for the week.
  goals:
  - Inquire about the current promotions and discounts available at Alcampo.
  - Ask which product categories typically have promotions at Alcampo.
  - Request information about any current promotional offers related to groceries.
  - Select a specific product category from the list of categories that typically have promotions to see current offers.
  - Ask about the delivery options available for promotional items and how to access them.
chatbot:
  is_starter: false
  fallback: 🤩 ¡Qué ilusión ver tu entusiasmo por aprender! 🧑🏻‍🎓 En Alcampo tenemos una sección de libros muy variada 📚 —seguro que encuentras algo que te encante.
  output:
  - current_promotions:
      type: string
      description: List of current promotional offers
  - typical_categories:
      type: string
      description: Common product categories with promotions
  - grocery_promotions:
      type: string
      description: Current grocery-related promotional offers
  - selected_category:
      type: string
      description: Specific product category chosen for offers
  - delivery_options:
      type: string
      description: Available delivery options for promotional items
  - order_tracking_info:
      type: string
      description: Information on order tracking limitations
  - pickup_options:
      type: string
      description: Guidance on selecting pickup options
  - discount_amount:
      type: money
      description: Value of current promotions or discounts
  - promotion_start_date:
      type: date
      description: Start date of the current promotions
  - promotion_end_date:
      type: date
      description: End date of the current promotions
  - eligible_products:
      type: string
      description: List of products eligible for discounts
  - total_discounted_items:
      type: int
      description: Count of items with promotional discounts
  - current_offer_details:
      type: string
      description: Details of current offers on selected items
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
