test_name: Product Inquiry and Order Placement
llm:
  temperature: 0.9
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: Customer looking to explore products and manage orders online
  context:
  - 'personality: personalities/formal-user'
  - You're planning to restock your household supplies and want to explore various options available online.
  - Additionally, you're interested in any current promotions that might help you save money on your next order.
  - Understanding the ordering process and delivery methods will help you make your purchase efficiently.
  goals:
  - Inquire about the types of products and services available at Alcampo.
  - Ask the chatbot to provide a list of product categories for promotions.
  - Select the {{chosen_promotions_category}} for more details.
  - Request information on how to place an order through Alcampo's website.
  - Ask about available delivery methods, including details on home delivery and pickup options.
  - chosen_promotions_category:
      function: forward()
      type: string
      data:
      - electronics
      - groceries
      - household goods
      - Clothing
chatbot:
  is_starter: false
  fallback: 🤩 ¡Qué ilusión ver tu entusiasmo por aprender! 🧑🏻‍🎓 En Alcampo tenemos una sección de libros muy variada 📚 —seguro que encuentras algo que te encante.
  output:
  - product_types:
      type: string
      description: Types of products offered by Alcampo
  - promotion_categories:
      type: string
      description: List of promotional product categories
  - chosen_promotions_category:
      type: string
      description: Selected promotional category for details
  - order_placement_guidance:
      type: string
      description: Steps for placing an order online
  - delivery_methods:
      type: string
      description: Available delivery options
  - home_delivery_details:
      type: string
      description: Information on home delivery service
  - pickup_options:
      type: string
      description: Details on in-store pickup options
  - selected_blender_model:
      type: string
      description: Specific model of blender queried
  - registration_steps:
      type: string
      description: Steps to register for an account
  - issue_reporting_guidance:
      type: string
      description: How to report order issues
  - delivery_time_slots:
      type: string
      description: Available delivery time slot options
  - same_day_delivery_availability:
      type: string
      description: Same-day delivery service details
  - cart_item_count:
      type: int
      description: Number of items in the shopping cart
  - checkout_total:
      type: money
      description: Total cost at checkout
  - user_account_info:
      type: string
      description: Required information for account registration
  - order_status:
      type: string
      description: Current status of the order
conversation:
  number: 4
  max_cost: 0.6
  goal_style:
    steps: 30
  interaction_style:
  - single question
