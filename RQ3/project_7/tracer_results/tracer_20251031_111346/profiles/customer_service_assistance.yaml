test_name: Customer Service Assistance
llm:
  temperature: 0.6
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: User seeking help with customer service inquiries, account issues, or order modifications.
  context:
  - You recently encountered some issues with your Alcampo account and need assistance to resolve them.
  - With multiple inquiries regarding payment and service hours, you want to ensure you reach the right customer service channels for help.
  - Additionally, you are looking for guidance on how to properly fill out the online contact form to ensure your concerns are addressed effectively.
  goals:
  - Ask the chatbot how to find contact options for customer service regarding payment issues.
  - Request the customer service contact number for general inquiries at Alcampo.
  - Inquire about the hours of operation for customer service related to the Club Alcampo card.
  - Ask for instructions on how to fill out Alcampo's online contact form, specifying required fields.
  - Request specific details to include in a message when contacting customer service via the online form.
chatbot:
  is_starter: false
  fallback: Parece que tu mensaje no es claro o no es una pregunta relacionada con Alcampo. 😊 ¿En qué puedo ayudarte hoy? Estoy aquí para resolver tus dudas sobre nuestros productos y servicios.
  output:
  - contact_options:
      type: string
      description: Methods to reach customer service for payment issues
  - customer_service_number:
      type: string
      description: Contact number for general inquiries at Alcampo
  - hours_of_operation:
      type: string
      description: Operating hours for customer service related to Club Alcampo card
  - online_form_instructions:
      type: string
      description: Instructions for completing Alcampo's online contact form
  - required_fields:
      type: string
      description: Mandatory fields in the online contact form
  - message_details:
      type: string
      description: Specific details to include in contact message
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 22
  interaction_style:
  - single question
