test_name: Product Discovery and Promotions
llm:
  temperature: 0.8
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: Shopper exploring product offerings, promotions, and specific items available at Alcampo.
  context:
  - 'personality: personalities/conversational-user'
  - You are planning a family gathering and want to stock up on fresh ingredients and snacks.
  - You're particularly interested in any ongoing promotions and the availability of seasonal organic options to ensure a healthy selection for your guests.
  - Additionally, you need to confirm the payment methods to facilitate your online order without any issues.
  goals:
  - Ask the chatbot about the payment methods accepted for online orders.
  - Request the current promotions available, particularly on fresh fruits and organic products.
  - Inquire about the seasonal organic fruits currently available for purchase.
  - Select the item category {{chosen_item_category}} after asking for available product categories.
  - Ask for details regarding the features of the {{chosen_item_type}} from the list of available products.
  - chosen_item_category:
      function: forward()
      type: string
      data:
      - baby items
      - beverages
      - electronic appliances
      - food
      - hygiene products
      - toys
      - Pet Supplies
  - chosen_item_type:
      function: forward()
      type: string
      data:
      - Standard
      - Organic
      - Seasonal
      - Bulk
      - Premium
chatbot:
  is_starter: false
  fallback: Parece que tu mensaje no es claro o no es una pregunta relacionada con Alcampo. 😊 ¿En qué puedo ayudarte hoy? Estoy aquí para resolver tus dudas sobre nuestros productos y servicios.
  output:
  - payment_methods_info:
      type: string
      description: Information about accepted payment methods
  - current_promotions_info:
      type: string
      description: Details of current promotions available
  - seasonal_organic_fruits:
      type: string
      description: List of currently available seasonal organic fruits
  - chosen_item_category:
      type: string
      description: Selected item category from available options
  - chosen_item_type:
      type: string
      description: Selected item type from available products
  - customer_contact_options:
      type: string
      description: Ways to contact customer service
  - product_catalog_overview:
      type: string
      description: Overview of available product categories
  - organic_product_promotions:
      type: string
      description: Description of promotions on organic products
  - online_order_features:
      type: string
      description: Features of Alcampo's online shopping experience
  - promotions_page_info:
      type: string
      description: URL direct to promotions and discounts page
  - item_features_info:
      type: string
      description: Features of the selected item type
conversation:
  number: 7
  max_cost: 1.05
  goal_style:
    steps: 30
  interaction_style:
  - single question
