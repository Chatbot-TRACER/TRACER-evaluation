test_name: Online Ordering Process
llm:
  temperature: 0.9
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: Customer looking to place an order online, including selecting items, payment, and delivery options.
  context:
  - You've decided to order groceries online to save time and ensure you have everything you need for the week ahead.
  - You want to understand the process of placing an order, from selecting items to managing payment and delivery options.
  - Additionally, you're curious about the account setup and return policy for online purchases.
  goals:
  - Ask the chatbot to guide through the online ordering process.
  - Inquire about the available delivery options for online orders.
  - Request the steps required to create an account on the Alcampo website.
  - Ask what payment methods are accepted for online orders.
  - Inquire about the return policy for online purchases.
chatbot:
  is_starter: false
  fallback: Parece que tu mensaje no es claro o no es una pregunta relacionada con Alcampo. 😊 ¿En qué puedo ayudarte hoy? Estoy aquí para resolver tus dudas sobre nuestros productos y servicios.
  output:
  - order_id:
      type: string
      description: Unique identifier for the order
  - item_count:
      type: int
      description: Total number of items ordered
  - delivery_option:
      type: string
      description: Chosen delivery method (home/pickup)
  - delivery_cost:
      type: money
      description: Cost of delivery service
  - account_creation_steps:
      type: string
      description: Steps to create an account
  - required_details:
      type: string
      description: Necessary details for account registration
  - payment_methods:
      type: string
      description: Accepted payment options
  - return_policy_info:
      type: string
      description: Conditions for returns
  - tracking_instructions:
      type: string
      description: Instructions for tracking order
  - order_status:
      type: string
      description: Current status of the order
  - delay_instructions:
      type: string
      description: Guidance for handling order delays
  - inquiry_template:
      type: string
      description: Template for customer inquiries
  - cancellation_contact:
      type: string
      description: Contact information for order changes
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
