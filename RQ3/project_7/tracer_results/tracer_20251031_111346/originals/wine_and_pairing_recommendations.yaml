test_name: Wine and Pairing Recommendations
llm:
  temperature: 1.0
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: Customer looking for wine suggestions and pairing advice specific to meals or occasions.
  context:
  - 'personality: personalities/elderly-user'
  - You are planning a special dinner featuring traditional Spanish cuisine and want to impress your guests with the perfect wine pairings.
  - Your focus is on selecting complementary wines that enhance the flavors of the dishes you have chosen, particularly a savory delicacy.
  - You also want to explore local options for purchasing these wines online to ensure a smooth experience leading up to the event.
  goals:
  - Ask for recommendations on types of Spanish wines that pair well with Iberian ham.
  - Inquire about the availability of Spanish wines in the Alcampo online store.
  - Request a list of white and semi-sweet wines available at Alcampo.
  - Seek assistance in finding a specific bottle of semi-sweet wine based on my preferences.
  - Ask for guidance on what details to include when contacting customer service regarding wine selections.
chatbot:
  is_starter: false
  fallback: Parece que tu mensaje no es claro o no es una pregunta relacionada con Alcampo. 😊 ¿En qué puedo ayudarte hoy? Estoy aquí para resolver tus dudas sobre nuestros productos y servicios.
  output:
  - wine_pairing_recommendation:
      type: string
      description: Suggested wine types with Iberian ham
  - availability_status:
      type: string
      description: Availability of Spanish wines at Alcampo online
  - wine_selection_prompt:
      type: string
      description: Prompt to browse white and semi-sweet wines
  - specific_bottle_request:
      type: string
      description: User's request for specific semi-sweet wine
  - customer_service_details:
      type: string
      description: Essential details for contacting customer service
  - wine_types_info:
      type: string
      description: Information on other wine types available
  - user_goal_count:
      type: int
      description: Number of goals user wishes to achieve
  - recommended_wine_count:
      type: int
      description: Number of wine recommendations provided
  - semi_sweet_wine_count:
      type: int
      description: Count of available semi-sweet wines
  - total_white_wine_count:
      type: int
      description: Total number of white wines available
  - pairing_occasion:
      type: string
      description: Occasion for which wine is being recommended
  - specific_preferences:
      type: string
      description: User preferences for wine selection
  - interaction_timestamp:
      type: date
      description: Date of user interaction
  - interaction_time:
      type: time
      description: Time of user interaction
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
