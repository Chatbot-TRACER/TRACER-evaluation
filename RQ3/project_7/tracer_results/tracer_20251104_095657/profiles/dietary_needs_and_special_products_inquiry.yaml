test_name: Dietary Needs and Special Products Inquiry
llm:
  temperature: 0.4
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: A customer with specific dietary requirements or preferences seeking detailed information about relevant product options.
  context:
  - 'personality: personalities/sarcastic-user'
  - After recently adopting a diet to accommodate your specific dietary requirements, you're exploring options for fresh dairy products that fit your needs.
  - You're particularly focused on finding lactose-free alternatives and exploring various plant-based options to diversify your meals.
  - With a preference for vegetarian and vegan choices, you're eager to learn more about the available brands and products at your local store.
  goals:
  - Ask what types of fresh dairy products are available in Alcampo.
  - Confirm the availability of lactose-free dairy products.
  - Inquire about the specific brands of lactose-free cheese available at Alcampo.
  - Ask for recommendations on plant-based dairy alternatives and request information about soy products.
  - Request a list of available vegetarian and vegan burger options.
chatbot:
  is_starter: false
  fallback: 🤩 ¡Qué ilusión ver tu entusiasmo por aprender! 🧑🏻‍🎓 En Alcampo tenemos una sección de libros muy variada 📚 —seguro que encuentras algo que te encante para seguir explorando tus curiosidades.
  output:
  - fresh_dairy_types:
      type: string
      description: Types of fresh dairy products available
  - lactose_free_availability:
      type: string
      description: Confirmation of lactose-free products availability
  - lactose_free_cheese_brands:
      type: string
      description: Specific brands of lactose-free cheese
  - plant_based_recommendations:
      type: string
      description: Recommendations for plant-based dairy alternatives
  - soy_product_information:
      type: string
      description: Information about available soy products
  - vegetarian_burger_options:
      type: string
      description: List of available vegetarian burger options
  - vegan_burger_options:
      type: string
      description: List of available vegan burger options
  - plant_based_burger_flavors:
      type: string
      description: Flavors of plant-based burgers available
  - nutritional_values_reference:
      type: string
      description: Reference for detailed nutritional values
  - prepared_meat_options:
      type: string
      description: Information about prepared meat options available
  - perishables_brand_selection:
      type: string
      description: Selection of brands for perishable items
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
