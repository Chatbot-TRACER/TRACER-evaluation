test_name: Shopping Experience and App Utilization
llm:
  temperature: 0.7
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: A customer interested in maximizing their shopping experience at Alcampo through loyalty programs and app features.
  context:
  - 'personality: personalities/conversational-user'
  - You are eager to enhance your shopping experience at Alcampo by taking advantage of their loyalty programs and app offerings.
  - As a health-conscious shopper, you're particularly interested in finding lactose-free dairy options while ensuring you make the most of exclusive member discounts.
  - To achieve this, you want to get familiar with the Club Alcampo app and its features.
  goals:
  - Ask the chatbot for the link to register for Club Alcampo.
  - Request guidance on downloading the Club Alcampo app.
  - Inquire about the features available in the Club Alcampo app.
  - Ask for information on current discounts available for Club Alcampo members.
  - Request details about the various lactose-free dairy products available at Alcampo.
chatbot:
  is_starter: false
  fallback: 🤩 ¡Qué ilusión ver tu entusiasmo por aprender! 🧑🏻‍🎓 En Alcampo tenemos una sección de libros muy variada 📚 —seguro que encuentras algo que te encante para seguir explorando tus curiosidades.
  output:
  - registration_link:
      type: string
      description: Link for Club Alcampo registration
  - app_download_steps:
      type: string
      description: Steps to download Club Alcampo app
  - app_features:
      type: string
      description: Features of the Club Alcampo app
  - activation_methods:
      type: string
      description: Methods to activate Club Alcampo card
  - current_discounts:
      type: string
      description: Current discounts for Club Alcampo members
  - lactose_free_products:
      type: string
      description: List of lactose-free dairy products available
  - customer_service_contact:
      type: string
      description: Contact information for customer service
  - app_availability:
      type: string
      description: Availability of app for iOS and Android
  - help_section_link:
      type: string
      description: Link to help section or FAQs
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 28
  interaction_style:
  - single question
