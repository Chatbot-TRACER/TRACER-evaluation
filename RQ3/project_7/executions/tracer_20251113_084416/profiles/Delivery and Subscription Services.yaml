test_name: Delivery and Subscription Services
llm:
  temperature: 0.6
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: Customer interested in delivery details and subscription services
  context:
  - 'personality: personalities/direct-user'
  - You recently decided to explore subscription services that offer convenient grocery delivery to save time on shopping.
  - You're particularly interested in understanding the benefits of these services, including any potential promotions that might be available for organic products.
  - Evaluating delivery options and fees also plays a crucial role in your decision-making process to ensure it aligns with your needs.
  goals:
  - Ask the chatbot to explain the Alcampo Más subscription service and its benefits.
  - Inquire about the delivery fees and ask how they vary based on store and area.
  - Request information about any current promotions available for groceries.
  - Ask what types of delivery options are available, including home delivery and pickup.
  - Investigate what organic food promotions are currently available.
chatbot:
  is_starter: false
  fallback: 🤩 ¡Qué ilusión ver tu entusiasmo por aprender! 🧑🏻‍🎓 En Alcampo tenemos una sección de libros muy variada 📚 —seguro que encuentras algo que te encante.
  output:
  - subscription_service_name:
      type: string
      description: Name of the subscription service
  - subscription_benefits:
      type: string
      description: Benefits of the Alcampo Más subscription
  - delivery_fee:
      type: money
      description: Cost of delivery fees
  - fee_variation_details:
      type: string
      description: Variations of fees by store and area
  - current_promotions:
      type: string
      description: Current promotional offers available
  - delivery_options:
      type: string
      description: Types of delivery options available
  - organic_food_promotions:
      type: string
      description: Current promotions for organic food
  - product_substitution_availability:
      type: string
      description: Availability of product substitution
  - flat_rate_delivery_service:
      type: string
      description: Flat-rate delivery service details
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 28
  interaction_style:
  - single question
