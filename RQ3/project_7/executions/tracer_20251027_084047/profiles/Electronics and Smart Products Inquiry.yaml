test_name: Electronics and Smart Products Inquiry
llm:
  temperature: 0.8
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: A user interested in exploring and purchasing electronics, home entertainment systems, and smart home products.
  context:
  - You are in the market for upgrading your home entertainment system, particularly looking for the latest electronics and smart home gadgets.
  - With a keen interest in optimizing your viewing experience, you're exploring various television options that fit your space and budget, along with any current promotions.
  - You're also considering complementary accessories that can enhance your new device's functionality and performance.
  goals:
  - Inquire about the variety of electronics available at Alcampo.
  - Ask what specific types of televisions are currently offered in the electronics category.
  - Request information on current promotions and discounts available for electronics.
  - Select the television size {{television_size_options}} that interests me.
  - Ask for accessories that would complement the selected television model {{chosen_television_model}}.
  - chosen_television_model:
      function: forward()
      type: string
      data:
      - LG 43" 4K UHD Smart TV
      - LG 55" 8K Ultra HD Smart TV
  - television_size_options:
      function: forward()
      type: string
      data:
      - 32 inches
      - 40 inches
      - 50 inches
      - 55 inches
      - 65 inches
chatbot:
  is_starter: false
  fallback: 🤩 ¡Qué ilusión ver tu entusiasmo por aprender! 🧑🏻‍🎓 En Alcampo tenemos una sección de libros muy variada 📚 —seguro que encuentras algo que te encante.
  output:
  - electronics_product_types:
      type: string
      description: Types of electronics available
  - television_size_options:
      type: string
      description: Available television sizes
  - promotions_link:
      type: string
      description: URL for current promotions
  - selected_tv_model:
      type: string
      description: Chosen television model
  - accessory_recommendations:
      type: string
      description: Suggested accessories for television
  - smart_plug_features:
      type: string
      description: Features of smart plugs
  - smart_plug_models:
      type: string
      description: Available smart plug models
  - tp_link_tapo_p110_features:
      type: string
      description: Features of TP-LINK Tapo P110
  - activity_bands_availability:
      type: string
      description: Information about activity bands availability
conversation:
  number: 5
  max_cost: 0.75
  goal_style:
    steps: 28
  interaction_style:
  - single question
