test_name: General Shopper and Member Support
llm:
  temperature: 0.8
  model: gpt-4o-mini
  format:
    type: text
user:
  language: English
  role: A customer looking to understand product availability, promotions, and membership benefits while utilizing the online shopping platform and associated services.
  context:
  - You're planning meals for the week and want to ensure you make smart, cost-effective shopping choices.
  - As a member of Alcampo's Club de Socios, you're particularly interested in maximizing your savings through promotions and understanding your membership benefits.
  - Additionally, you have dietary preferences that require exploring specific product options, like lactose-free items available on the platform.
  goals:
  - Inquire about current promotions and discounts available at Alcampo.
  - Ask the chatbot to provide an overview of the main functions and services offered by Alcampo.
  - Request information about the benefits associated with membership in the Club de Socios.
  - Inquire about the types of delivery options available when shopping online.
  - Ask the chatbot for detailed information about lactose-free dairy products, including what specific items are available.
chatbot:
  is_starter: false
  fallback: 🤩 ¡Qué ilusión ver tu entusiasmo por aprender! 🧑🏻‍🎓 En Alcampo tenemos una sección de libros muy variada 📚 —seguro que encuentras algo que te encante para seguir explorando tus curiosidades.
  output:
  - current_promotions_link:
      type: string
      description: Link to current promotions page
  - services_overview:
      type: string
      description: Summary of Alcampo services
  - membership_benefits:
      type: string
      description: Benefits of Club de Socios membership
  - delivery_options:
      type: string
      description: Types of delivery options available
  - lactose_free_products_details:
      type: string
      description: Details on lactose-free dairy products
  - product_categories:
      type: string
      description: List of product categories available
  - subscription_link:
      type: string
      description: Link to subscribe to Alcampo Más
  - subscription_benefits:
      type: string
      description: Benefits of Alcampo Más subscription
  - delivery_minimum_order:
      type: money
      description: Minimum order amount for delivery
  - payment_methods:
      type: string
      description: Accepted payment methods for online orders
  - return_policy:
      type: string
      description: Overview of returns and refunds policy
  - damaged_product_procedure:
      type: string
      description: Steps for reporting damaged products
  - incorrect_item_procedure:
      type: string
      description: Steps for incorrect items received
  - customer_service_contact:
      type: string
      description: Contact information for customer service
  - order_confirmation_id:
      type: string
      description: Unique identifier for order confirmation
  - order_amount:
      type: money
      description: Total amount due for the order
  - delivery_time_slot:
      type: time
      description: Scheduled time slot for delivery
  - product_description:
      type: string
      description: Description of specific products
  - special_offers_link:
      type: string
      description: Link to special offers page
  - club_alcampo_program_details:
      type: string
      description: Details on the Club Alcampo loyalty program
  - any_additional_app_functionality:
      type: string
      description: Overview of additional app functionalities
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
