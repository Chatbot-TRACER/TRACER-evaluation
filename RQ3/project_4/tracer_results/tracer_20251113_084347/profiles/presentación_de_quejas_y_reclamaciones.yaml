test_name: Presentación de Quejas y Reclamaciones
llm:
  temperature: 0.6
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Usuario que desea presentar una queja o reclamación ante el Ayuntamiento.
  context:
  - 'personality: personalities/elderly-user'
  - Recientemente has tenido una experiencia negativa con un servicio municipal y sientes que es importante hacer tu voz escuchada.
  - Estás buscando la manera más efectiva de presentar formalmente tu queja al Ayuntamiento para que se tomen medidas al respecto.
  - Tu intención es asegurarte de seguir el proceso correcto para que tu reclamación sea considerada seriamente.
  goals:
  - ¿Cuáles son los métodos disponibles para presentar una queja o reclamación?
  - Por favor, dame más información sobre el proceso para presentar una queja o reclamación.
  - ¿Cómo puedo acceder a la Sede Electrónica para presentar una queja o reclamación?
  - Quisiera presentar una queja a través de la Sede Electrónica.
  - ¿Qué necesitaría incluir en la Instancia General para presentar mi queja?
chatbot:
  is_starter: false
  fallback: Me temo que no tengo la información para poder responder a su pregunta. Por favor, hágala por WhatsApp al número 744 48 12 52. Gracias.
  output:
  - submission_methods:
      type: string
      description: Opciones para presentar quejas
  - electronic_headquarters_link:
      type: string
      description: URL de la Sede Electrónica
  - complaint_process_info:
      type: string
      description: Información sobre el proceso de quejas
  - instance_inclusions:
      type: string
      description: Elementos a incluir en la Instancia General
  - digital_certificate_requirement:
      type: string
      description: Requisito de certificado digital para presentación
  - in_person_submission_info:
      type: string
      description: Información sobre presentación en persona
  - online_submission_info:
      type: string
      description: Instrucciones para presentación en línea
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 24
  interaction_style:
  - single question
