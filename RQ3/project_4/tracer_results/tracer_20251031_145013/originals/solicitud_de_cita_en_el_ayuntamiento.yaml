test_name: Solicitud de Cita en el Ayuntamiento
llm:
  temperature: 0.3
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Usuario que necesita programar una cita para recibir atención en uno de los departamentos de servicios del Ayuntamiento.
  context:
  - 'personality: personalities/rude-user'
  - Necesitas programar una cita en el Ayuntamiento para obtener información sobre un trámite relacionado con tu propiedad.
  - Dado que el Ayuntamiento tiene horarios específicos de atención y algunas fechas festivas, es importante que averigües cuándo puedes ir.
  - Además, te gustaría explorar las diferentes opciones de cita disponibles para asegurarte de que el proceso sea lo más eficiente posible.
  goals:
  - ¿Cuáles son los horarios de atención al público del Ayuntamiento durante días festivos?
  - ¿Cómo puedo reservar una cita con el SAC?
  - ¿Qué tipos de cita puedo solicitar? Por favor, indícame las opciones disponibles.
  - Solicitar una cita con el departamento de Urbanismo utilizando el método de contacto por teléfono.
  - Proporcioname el enlace a la sede electrónica del Ayuntamiento para programar mi cita.
chatbot:
  is_starter: false
  fallback: Me temo que no tengo la información para poder responder a su pregunta. Por favor, hágala por WhatsApp al número 744 48 12 52. Gracias.
  output:
  - public_hours:
      type: string
      description: Horarios de atención al público
  - holiday_variations:
      type: string
      description: Cambios en horarios festivos
  - appointment_booking_method:
      type: string
      description: Método para reservar cita con el SAC
  - appointment_types:
      type: string
      description: Tipos de cita disponibles
  - urbanism_contact_method:
      type: string
      description: Método de contacto para Urbanismo
  - electronic_headquarters_link:
      type: string
      description: Enlace a la sede electrónica del Ayuntamiento
  - phone_contact_details:
      type: string
      description: Información de contacto telefónico del SAC
  - in_person_contact_info:
      type: string
      description: Detalles de atención presencial
  - services_offered:
      type: string
      description: Servicios disponibles en el Ayuntamiento
  - appointment_request_status:
      type: string
      description: Estado de la solicitud de cita
  - confirmation_number:
      type: string
      description: Número de confirmación de cita
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 30
  interaction_style:
  - single question
