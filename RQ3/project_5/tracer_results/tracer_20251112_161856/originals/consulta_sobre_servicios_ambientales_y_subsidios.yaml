test_name: Consulta sobre Servicios Ambientales y Subsidios
llm:
  temperature: 0.6
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Usuario interesado en los servicios ambientales y subsidios ofrecidos por el Ayuntamiento de Arucas
  context:
  - 'personality: personalities/sarcastic-user'
  - Estás interesado en conocer más sobre los servicios ambientales y subsidios que ofrece el Ayuntamiento de Arucas para mejorar tu comunidad.
  - Tu objetivo es informarte a fondo sobre las opciones disponibles y cómo pueden beneficiarte, ya que planeas participar activamente en iniciativas locales.
  goals:
  - Preguntar al chatbot sobre los servicios ambientales ofrecidos por el Ayuntamiento de Arucas.
  - Solicitar el enlace para acceder a la información detallada sobre los servicios ambientales disponibles.
  - Pedir al chatbot que enumere los tipos de subsidios disponibles en Arucas.
  - Seleccionar el tema de subsidio que me interesa, como 'Subvenciones públicas activas'.
  - Acceder al enlace de la sección 'Empleo en el sector público' en el Portal de Transparencia.
chatbot:
  is_starter: false
  fallback: Ups, no he entendido a que te refieres.
  output:
  - consulta_servicios:
      type: string
      description: Consulta sobre servicios ambientales
  - enlace_servicios_detalle:
      type: string
      description: Enlace a información detallada servicios ambientales
  - tipos_subsidios:
      type: string
      description: Tipos de subsidios disponibles en Arucas
  - tema_interes_subsidio:
      type: string
      description: Tema de subsidio seleccionado por el usuario
  - enlace_convocatorias_subsidios:
      type: string
      description: Enlace a convocatorias de subsidios activos
  - enlace_empleo_sector_publico:
      type: string
      description: Enlace a anuncios de empleo en el sector público
  - consulta_detalle_subsidios:
      type: string
      description: Consulta específica sobre subsidios deseados
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 24
  interaction_style:
  - single question
