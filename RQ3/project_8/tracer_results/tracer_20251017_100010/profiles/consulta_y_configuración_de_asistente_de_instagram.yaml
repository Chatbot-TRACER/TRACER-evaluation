test_name: Consulta y Configuración de Asistente de Instagram
llm:
  temperature: 0.6
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Usuario interesado en implementar un asistente para su negocio en Instagram y desea información sobre automatización y opciones disponibles.
  context:
  - 'personality: personalities/impatient-user'
  - Estás explorando opciones para implementar un asistente en Instagram que mejore la atención al cliente de tu negocio.
  - Buscas información sobre las herramientas de automatización disponibles y cómo pueden integrarse con tus plataformas actuales.
  - Tu objetivo es optimizar la comunicación con tus clientes y aumentar la eficiencia de tus procesos en redes sociales.
  goals:
  - Confirmar la disponibilidad y los beneficios de tener un asistente para Instagram.
  - Pedir al chatbot que muestre los canales disponibles para la demostración de bots.
  - Seleccionar el canal {{canal_seleccionado}} para ver una demostración.
  - Solicitar información sobre cómo automatizar el servicio al cliente utilizando tecnología AI.
  - Pedir detalles sobre las opciones de integración y capacidades con varias herramientas y plataformas.
  - canal_seleccionado:
      function: forward()
      type: string
      data:
      - Facebook
      - Instagram
      - WhatsApp
      - Snapchat
chatbot:
  is_starter: false
  fallback: Parece que has escrito un texto aleatorio, ¿hay algo específico en lo que te pueda ayudar? Si necesitas información sobre la plataforma de Botslovers o temas relacionados con inteligencia artificial generativa, ¡estaré encantado de asistirte!
  output:
  - assistant_availability:
      type: string
      description: Confirmación de la disponibilidad del asistente
  - assistant_benefits:
      type: string
      description: Beneficios de tener un asistente para Instagram
  - demo_channels:
      type: string
      description: Canales disponibles para demostración
  - selected_channel:
      type: string
      description: Canal seleccionado para la demostración
  - automation_info:
      type: string
      description: Información sobre automatización del servicio al cliente
  - ai_benefits:
      type: string
      description: Beneficios de usar tecnología AI
  - integration_options:
      type: string
      description: Opciones de integración disponibles
  - integration_capabilities:
      type: string
      description: Capacidades de integración con herramientas
  - whatsapp_integration:
      type: string
      description: Detalles sobre integración de WhatsApp
  - customer_service_automation:
      type: string
      description: Automatización del servicio al cliente y ventas
conversation:
  number: 4
  max_cost: 0.6
  goal_style:
    steps: 30
  interaction_style:
  - single question
