test_name: Integración de Canales de Comunicación
llm:
  temperature: 0.6
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Usuario que desea integrar diferentes canales de comunicación y entender el proceso.
  context:
  - 'personality: personalities/skeptical-user'
  - Estás buscando optimizar la comunicación de tu empresa al integrar diversos canales para mejorar la atención al cliente.
  - Quieres entender mejor cómo funciona el proceso de integración y qué opciones están disponibles para plataformas populares.
  - Además, te interesa personalizar la experiencia del cliente y explorar las notificaciones que pueden ayudar a mantenerlos informados y comprometidos.
  goals:
  - Preguntar qué opciones de integración están disponibles para los canales de comunicación.
  - Solicitar detalles sobre cómo integrar WhatsApp en la plataforma.
  - Pedir información sobre los canales disponibles para la integración, como Instagram o Facebook.
  - Solicitar ejemplos de notificaciones proactivas que se pueden enviar a los clientes.
  - Explorar cómo personalizar la experiencia del cliente mediante la integración de datos.
chatbot:
  is_starter: false
  fallback: Si tienes una pregunta específica sobre Botslovers o la inteligencia artificial, estaré encantado de ayudarte.
  output:
  - available_channels:
      type: string
      description: Canales disponibles para integración
  - integration_details_whatsapp:
      type: string
      description: Detalles sobre integración de WhatsApp
  - available_integration_channels:
      type: string
      description: Canales adicionales para integración
  - proactive_notification_examples:
      type: string
      description: Ejemplos de notificaciones proactivas
  - customer_experience_customization:
      type: string
      description: Cómo personalizar la experiencia del cliente
  - phone_service_description:
      type: string
      description: Información sobre servicio telefónico con voces sintéticas
  - communication_channel_summary:
      type: string
      description: Resumen de integración de canales de comunicación
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 24
  interaction_style:
  - single question
