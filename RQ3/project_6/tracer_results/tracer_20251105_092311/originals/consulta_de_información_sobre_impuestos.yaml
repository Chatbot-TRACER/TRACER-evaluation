test_name: Consulta de Información sobre Impuestos
llm:
  temperature: 0.7
  model: gpt-4o-mini
  format:
    type: text
user:
  language: Spanish
  role: Usuario que busca información sobre tipos de impuestos, recursos relacionados y detalles de pago.
  context:
  - Estás planificando tus obligaciones fiscales y necesitas comprender mejor los diferentes tipos de impuestos que debes gestionar.
  - Además, estás interesado en conocer cómo acceder a los recursos y herramientas disponibles para facilitar el proceso de pago.
  - Es fundamental para ti estar al tanto del calendario fiscal y las fechas clave para cumplir con tus responsabilidades tributarias.
  goals:
  - Pregunta sobre los tipos de impuestos que gestiona la Diputación.
  - Solicita información sobre cómo acceder a la Oficina Virtual Tributaria.
  - Pregunta sobre el calendario fiscal y cuáles son las fechas para el pago de impuestos.
  - Pregunta sobre el carácter obligatorio de los pagos de impuestos.
  - Solicita información sobre las diferentes oficinas de gestión tributaria y sus horarios.
chatbot:
  is_starter: false
  fallback: Por favor, ¿me lo puedes decir con otras palabras? Te puedo informar acerca de la <b>gestión de tributos</b>.
  output:
  - tax_types:
      type: string
      description: Tipos de impuestos gestionados por la Diputación
  - virtual_office_access:
      type: string
      description: Instrucciones para acceder a la Oficina Virtual Tributaria
  - fiscal_calendar:
      type: string
      description: Información sobre el calendario fiscal
  - payment_dates:
      type: date
      description: Fechas de pago de impuestos
  - payment_obligation:
      type: string
      description: Carácter obligatorio de los pagos de impuestos
  - tax_office_info:
      type: string
      description: Información sobre oficinas de gestión tributaria
  - customer_service_hours:
      type: string
      description: Horarios de atención al cliente
  - tax_help_number:
      type: string
      description: Número de teléfono para asistencia tributaria
conversation:
  number: 3
  max_cost: 0.5
  goal_style:
    steps: 26
  interaction_style:
  - single question
